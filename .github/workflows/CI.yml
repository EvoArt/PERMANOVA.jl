name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - {version: '1.10', os: windows-latest}
          - {version: '1.10', os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
  vegan:
    name: Compare with vegan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("vegan")'
      - run: mkdir -p vegan_out && Rscript test/vegan/reference.R vegan_out
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project=vegan_env -e 'using Pkg; Pkg.develop(path="."); Pkg.add(["DelimitedFiles", "Distances"])'
      - run: julia --project=vegan_env test/vegan/compare.jl vegan_out
